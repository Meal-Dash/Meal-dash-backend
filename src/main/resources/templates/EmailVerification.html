<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Verify Your Email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f9fc;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #1a202c;
        }
        h2 {
            color: #2d3748;
        }
        p {
            color: #4a5568;
            font-size: 16px;
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #3182ce;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #a0aec0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">YourCompany</div>
    <h2>Verify Your Email Address</h2>
    <p>Hi there,<br><br>
        Thanks for signing up! Please click the button below to verify your email address and activate your account.
    </p>
    <a href="https://yourdomain.com/verify?token=your-verification-token" class="button">Verify Email</a>
    <p class="footer">If you did not sign up for this account, you can ignore this email.</p>
</div>
</body>
</html>
